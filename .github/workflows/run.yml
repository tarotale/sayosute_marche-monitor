name: Marche Inventory Bot

on:
  repository_dispatch:
    types: [run_marche_bot] # GAS側から指定するイベント名
  workflow_dispatch:        # 手動実行ボタン用（残しておくと便利）

# ※既存の schedule: - cron: ... の記述は削除してOKです。

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run script
        env:
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
        run: python main.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add syst_last_inventory.json
          git commit -m "Update inventory cache [skip ci]" || exit 0
          git push
